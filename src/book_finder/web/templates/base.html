<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Book Finder{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="top">
        {% block brand %}<a href="/" class="brand">&larr; {{ t('brand') }}</a>{% endblock %}
        <a href="/wishlist">{% from "_icons.html" import bookmark %}{{ bookmark(filled=true) }} {{ t('nav_wishlist') }}</a>
        <span class="lang-switch">
            {% for code in ["en", "sr-latn", "sr-cyrl"] %}<a href="{{ language_links[code] }}"{% if code == lang %} class="active"{% endif %}>{{ language_labels[code] }}</a>{% if not loop.last %} &middot; {% endif %}{% endfor %}
        </span>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
