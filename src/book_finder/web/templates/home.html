{% extends "base.html" %}
{% block title %}Book Finder{% endblock %}
{% block content %}
    <h1>Book Finder</h1>

    <form class="search" action="/search" method="get">
        <input type="text" name="q" placeholder="Search by title or author" required>
        <button type="submit">Search</button>
    </form>

    <h2>Browse by genre</h2>
    <div class="genres">
        {% for slug, genre in genre_slugs.items() %}
        <a href="/genres/{{ slug }}">{{ genre.value }}</a>
        {% endfor %}
    </div>
{% endblock %}
