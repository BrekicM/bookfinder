<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Book Finder</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        form { margin: 1.5rem 0; }
        input[type="text"] { width: 70%; padding: 0.5rem; font-size: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; }
        .genres { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .genres a {
            display: block; padding: 0.5rem 0.9rem; border: 1px solid #ddd; border-radius: 6px;
            text-decoration: none; color: #222;
        }
        .genres a:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Book Finder</h1>

    <form action="/search" method="get">
        <input type="text" name="q" placeholder="Search by title or author" required>
        <button type="submit">Search</button>
    </form>

    <h2>Browse by genre</h2>
    <div class="genres">
        {% for slug, genre in genre_slugs.items() %}
        <a href="/genres/{{ slug }}">{{ genre.value }}</a>
        {% endfor %}
    </div>
</body>
</html>
